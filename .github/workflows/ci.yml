name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-check:
    name: Check ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [app, gateway, mcp-notes]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint package
        run: npm run lint --if-present

      - name: Build package
        run: npm run build --if-present

      - name: Export Expo app
        if: matrix.package == 'app'
        run: npx expo export --platform web

  docker-build:
    name: Docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, mcp-notes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --file ${{ matrix.service }}/Dockerfile --tag scoutnote-${{ matrix.service }}:ci ${{ matrix.service }}
